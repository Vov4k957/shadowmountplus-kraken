<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark"><title>ShadowMount+ — Сохранения</title>
<style>
:root{color-scheme:dark;--bg:#080b12;--panel:#111722;--line:#263145;--text:#f4f7fb;--muted:#95a2b8;--accent:#55a7ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,sans-serif}
main{max-width:1050px;margin:auto;padding:18px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
h1{font-size:22px;margin:0}h2{font-size:18px;margin:0 0 12px}h3{margin:0;font-size:16px}
a{color:var(--accent)}button,select,input{font:inherit;color:inherit;background:#17243a;border:1px solid var(--line);border-radius:9px;padding:10px}
button{cursor:pointer}button:disabled{opacity:.5;cursor:default}button:hover{border-color:var(--accent)}
input{width:min(300px,100%)}.panel{padding:18px;background:var(--panel);border:1px solid var(--line);border-radius:14px;margin-bottom:15px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.muted{color:var(--muted)}.warning{color:#f1c078}
.item{border-top:1px solid var(--line);padding:13px 0;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
small{color:var(--muted);display:block}.primary{background:#147ee8;color:white;border-color:#147ee8}
#status{margin:10px 0;min-height:24px}.error{color:#ff8992}.ok{color:#62dca4}label{display:inline-flex;flex-direction:column;gap:4px}
@media(max-width:650px){main{padding:11px}.panel{padding:12px}label{flex:1 1 130px}label>select,label>input{width:100%}}
</style></head><body>
<main>
<header><div><h1>Сохранения PS5Save · M.2</h1><div class="muted">ShadowMountPlus / Kraken Mount</div></div><a href="/">← Вернуться в SM+</a></header>
<section class="panel">
 <div class="row">
  <label>Профиль PS5<select id="user"></select></label>
  <label>Игра / слот<input id="search" type="search" placeholder="PPSA02100"></label>
  <label>Версия<select id="version"><option value="">Все</option></select></label>
  <button id="refresh" type="button">Обновить</button>
 </div>
 <p class="muted">Источник: /mnt/ext1/PS5Save/backup и backup_daily</p>
 <p class="warning">Полностью закройте игру. Перед заменой SM+ резервирует текущий зашифрованный сейв в PS5Save/smp_before_restore на M.2.</p>
 <div id="status" role="status"></div>
</section>
<section class="panel"><h2>Доступные сохранения</h2><div id="results">Загрузка…</div></section>
</main>
<script>
"use strict";
const el = id => document.getElementById(id);
let entries=[], mounted=false, busy=false;
function say(message,cls){el("status").className=cls||"";el("status").textContent=message;}
async function api(path,body){
 const response=await fetch(path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body),cache:"no-store"});
 const value=await response.json();
 if(!response.ok)throw Error(value.error||value.message||"HTTP "+response.status);
 return value;
}
function render(){
 const container=el("results");container.replaceChildren();
 const filter=el("search").value.trim().toUpperCase(), version=el("version").value;
 if(!mounted){container.textContent="Диск M.2 /mnt/ext1 не смонтирован.";return;}
 const groups=new Map();
 for(const item of entries){
  if(version&&item.version!==version)continue;
  if(filter&&!item.title_id.includes(filter)&&!item.slot.toUpperCase().includes(filter))continue;
  const key=[item.platform,item.title_id,item.backup_user,item.version,item.slot].join("|");
  if(!groups.has(key))groups.set(key,[]);
  groups.get(key).push(item);
 }
 if(!groups.size){container.textContent="Нет совпадений. Если у профиля нет сохранения игры, сначала создайте сейв в самой игре.";return;}
 const keys=[...groups.keys()].sort((a,b)=>{
  const x=groups.get(a)[0],y=groups.get(b)[0];
  if(x.title_id!==y.title_id)return x.title_id.localeCompare(y.title_id);
  if(x.version==="latest")return -1;if(y.version==="latest")return 1;
  return y.version.localeCompare(x.version);
 });
 for(const key of keys){
  const matches=groups.get(key), item=matches[0];
  const row=document.createElement("div");row.className="item";
  const title=document.createElement("div"),h=document.createElement("h3"),sub=document.createElement("small");
  h.textContent=item.title_id+" · "+item.slot;
  sub.textContent=item.platform.toUpperCase()+" · "+(item.version==="latest"?"Последняя копия":item.version)+" · архив профиля "+item.backup_user;
  title.append(h,sub);
  const right=document.createElement("div");right.className="row";
  const target=document.createElement("select");target.setAttribute("aria-label","Целевой сейв");
  for(const x of matches){const o=document.createElement("option");o.value=x.image;o.textContent=x.image;target.append(o);}
  const button=document.createElement("button");button.textContent="Восстановить";button.className="primary";button.disabled=busy;
  button.addEventListener("click",()=>restore(matches,target.value));
  right.append(target,button);row.append(title,right);container.append(row);
 }
}
async function load(user){
 if(busy)return;busy=true;el("refresh").disabled=true;say("Читаю копии с M.2…");
 try{
  const data=await api("/api/v1/saves/catalog",{user:user||""});
  mounted=Boolean(data.mounted);entries=Array.isArray(data.items)?data.items:[];
  el("user").replaceChildren();
  for(const u of data.users||[]){const option=document.createElement("option");option.value=u;option.textContent=u;el("user").append(option);}
  el("user").value=data.selected_user||"";
  const old=el("version").value;el("version").replaceChildren();
  const all=document.createElement("option");all.value="";all.textContent="Все копии";el("version").append(all);
  const versions=[...new Set(entries.map(x=>x.version))].sort((a,b)=>a==="latest"?-1:b==="latest"?1:b.localeCompare(a));
  for(const v of versions){const o=document.createElement("option");o.value=v;o.textContent=v==="latest"?"Последняя копия":v;el("version").append(o);}
  if(versions.includes(old))el("version").value=old;
  say(mounted?"Вариантов: "+entries.length+(data.truncated?" (первые 512)":""):"M.2 не смонтирован",mounted?"ok":"error");
 }catch(e){mounted=false;entries=[];say("Ошибка: "+e.message,"error");}
 finally{busy=false;el("refresh").disabled=false;render();}
}
async function restore(matches,image){
 if(busy)return;
 const item=matches.find(x=>x.image===image);
 if(!item)return;
 const dest=item.user+" / "+item.title_id+" / "+image;
 if(!confirm("Восстановить "+item.slot+" ("+item.version+") в "+dest+"?\n\nИгра должна быть закрыта. Сначала SM+ сделает копию текущего сейва."))return;
 busy=true;render();say("Выполняется восстановление "+dest+"… Не закрывайте страницу.");
 try{
  const result=await api("/api/v1/saves/restore",item);
  if(!result.restored)throw Error("Сервер не подтвердил восстановление");
  say("Готово! Предыдущее сохранение находится в PS5Save/smp_before_restore.","ok");
 }catch(e){say("Восстановление не выполнено: "+e.message,"error");}
 finally{busy=false;render();}
}
el("refresh").addEventListener("click",()=>load(el("user").value));
el("user").addEventListener("change",()=>load(el("user").value));
el("search").addEventListener("input",render);
el("version").addEventListener("change",render);
load("");
</script></body></html>
